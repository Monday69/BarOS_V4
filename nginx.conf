# ─────────────────────────────────────────────────────────────────────────────
#  BarOS V4 — Nginx Configuration
#
#  Routes :
#    /api/*  → proxy vers backend FastAPI (port 8000)
#    /*      → fichiers statiques React (SPA fallback sur index.html)
#
#  Placé dans /etc/nginx/conf.d/default.conf via volume docker-compose
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # ── Fichiers statiques React ──────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Cache agressif pour les assets hashés (js, css, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API → FastAPI backend ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;

        # WebSocket support (pour les events temps réel)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts généreux pour les séquences de versement (peuvent durer > 30s)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback — React Router ───────────────────────────────────────────
    # Toute URL inconnue → index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}